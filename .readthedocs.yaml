# Check the readthedocs documentation for zensical https://docs.readthedocs.com/platform/latest/intro/zensical.html

version: 2

build:
    os: ubuntu-24.04
    tools:
        python: "3.13"
    jobs:
        install:
            - pip install uv
            - uv sync --group docs --no-dev
        build:
            html:
                - uv run zensical build
        post_build:
            - mkdir -p $READTHEDOCS_OUTPUT/html/
            - cp --recursive public/* $READTHEDOCS_OUTPUT/html/
