[project]
name = "atlas"
version = "0.1.0"
description = "A tool for simulating power market such as day-ahead, intraday, and reserves markets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.3",
    "mkdocs-material>=9.6.11",
    "mkdocstrings>=0.29.1",
    "mkdocstrings-python>=1.16.10",
    "numpy>=2.0.1",
    "ortools>=9.12.4544",
    "pandas>=2.2.2",
    "pytest>=8.3.5",
    "pyyaml>=6.0.1",
    "ruff>=0.9.7",
]


[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
packages.find.include = ['atlas*']

[tool.ruff]
line-length = 120
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
ignore = ["B028", "B904", "W291", "EM102", "PTH119", "PTH118", "PTH103", "PTH100", "PD901", "D205", "D401", "TRY003", "D404", "EM101"]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403"]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
