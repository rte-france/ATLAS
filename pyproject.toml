[project]
name = "atlas"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.1",
    "pandas>=2.2.2",
    "pyyaml>=6.0.1",
    "ruff>=0.9.7",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
    "tox>=4.24.1",
]


[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
packages.find.include = ['atlas*']

[tool.ruff]
line-length = 120
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
ignore = ["B028", "B904", "W291", "EM102", "PTH119", "PTH118", "PTH103", "PTH100", "PD901", "D205", "D401", "TRY003", "D404", "EM101"]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403"]
