[project]
name = "rte-atlas"
version = "0.1.0"
description = "A tool for simulating power market such as day-ahead, intraday, and reserves markets."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastparquet>=2024.11.0",
    "h5py>=3.13.0",
    "loguru>=0.7.3",
    "numpy>=2.0.1",
    "ortools>=9.12.4544,<9.15",
    "pandas>=2.2.2",
    "pendulum>=3.0.0",
    "plotly>=6.0.1",
    "polars>=1.27.0",
    "pyarrow>=20.0.0",
    "pydantic>=2.11.3",
    "pydantic-extra-types>=2.10.4",
    "pydantic-settings>=2.10.1",
    "pytz>=2025.1",
    "pyyaml>=6.0.1",
    "typer>=0.15.2",
    "typing-extensions>=4.13.2",
    "dictdiffer>=0.9.0",
    "pyinstrument>=5.1.2",
]

[project.scripts]
atlas = "atlas.app:app"

[build-system]
requires = ["uv_build>=0.7.19,<0.8.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "atlas"
module-root = ""

[[tool.uv.index]]
url = "https://pypi.org/simple/"

[tool.ruff]
line-length = 120
extend-exclude = ["*.ipynb"]


[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",
    "B008",
    "C901",
    "W191",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401", "F403"]

[dependency-groups]
dev = [
    "ipython>=8.35.0",
    "jupyter>=1.1.1",
    "pandas-stubs>=2.2.3.250308",
    "coverage>=7.8.0",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff>=0.9.7",
    "types-pyyaml>=6.0.12.20250402",
    "pre-commit>=4.2.0",
    "plotly-stubs>=0.0.5",
    "ortools-stubs>=8.0.0",
    "types-pytz>=2025.2.0.20251108",
    "pyinstrument>=5.1.2",
]
docs = [
    "mkdocs-jupyter>=0.25.1",
    "mkdocstrings>=0.29.1",
    "mkdocstrings-python>=1.16.10",
    "zensical>=0.0.43",
]

[tool.mypy]
disable_error_code = ["operator"]
[[tool.mypy.overrides]]
module = ["atlas.solver.solver_interface",
          "atlas.solver.solver_helper"]
ignore_errors = true

[tool.coverage.run]
omit = ['atlas/io_utils/prometheus_transformer.py']

[[tool.mypy.overrides]]
module = ["dictdiffer.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests as integration tests (run only on pull requests)",
]
