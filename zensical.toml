[project]
site_name = "Atlas"
site_description = "Atlas documentation website"
site_url = "https://rte-france.github.io/ATLAS/"
site_author = "RTE France"
copyright = "Copyright &copy; 2024 - RTE"

repo_url = "https://github.com/rte-france/ATLAS"
repo_name = "rte-france/atlas"

# Extra CSS and JavaScript
extra_css = [
  "https://unpkg.com/katex@0/dist/katex.min.css",
  "https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.1.0/github-markdown.min.css",
  "custom/custom.css"
]

extra_javascript = [
  "custom/katex.js",
  "https://unpkg.com/katex@0/dist/katex.min.js",
  "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js"
]

# Navigation
nav = [
  { "Home" = [
    { "Welcome to Atlas" = "index.md" },
    { "Getting Started" = "getting_started.md" },
    { "CLI Reference" = "cli.md" },
    { "Contributing" = "contributing.md" },
    { "Release Process" = "release_process.md" },
    { "Changelog" = "changelog.md" },
    { "Authors" = "authors.md" }
  ]},
  { "Concepts" = [
    { "Overview" = "concepts/overview.md" }
  ]},
  { "Modules" = [
    { "Portfolio Optimisation" = [
      { "Overview" = "modules/portfolio-optimisation/index.md" },
      { "User Guide" = [
        { "Overview" = "modules/portfolio-optimisation/user-guide/overview.md" },
        { "Parameters" = "modules/portfolio-optimisation/user-guide/input-data.md" },
        { "Running" = "modules/portfolio-optimisation/user-guide/running.md" },
        { "Results" = "modules/portfolio-optimisation/user-guide/results.md" },
        { "Examples" = "modules/portfolio-optimisation/user-guide/examples.md" }
      ]},
      { "Developer" = [
        { "Architecture" = "modules/portfolio-optimisation/developer/architecture.md" }
      ]}
    ]},
    { "Market Clearing" = [
      { "Overview" = "modules/market-clearing/index.md" },
      { "User Guide" = [
        { "Overview" = "modules/market-clearing/user-guide/overview.md" },
        { "Parameters" = "modules/market-clearing/user-guide/input-data.md" },
        { "Running" = "modules/market-clearing/user-guide/running.md" }
      ]},
      { "Developer" = [
        { "Architecture" = "modules/market-clearing/developer/architecture.md" }
      ]}
    ]},
    { "Day-Ahead Orders" = [
      { "Overview" = "modules/day-ahead-orders/index.md" },
      { "User Guide" = [
        { "Overview" = "modules/day-ahead-orders/user-guide/overview.md" },
        { "Parameters" = "modules/day-ahead-orders/user-guide/input-data.md" },
        { "Running" = "modules/day-ahead-orders/user-guide/running.md" }
      ]},
      { "Developer" = [
        { "Architecture" = "modules/day-ahead-orders/developer/architecture.md" }
      ]}
    ]}
  ]},
  { "API Reference" = [
    { "Math Objects" = [
      { "Timeseries" = "api/math/timeseries.md" },
      { "Scenario Matrix" = "api/math/scenario_matrix.md" },
      { "Forecasting Matrix" = "api/math/forecasting_matrix.md" },
      { "LazyTimeseries" = "api/math/lazy_timeseries.md" },
      { "LazyMatrix" = "api/math/lazy_matrix.md" }
    ]},
    { "I/O" = [
      { "AtlasDataset" = "api/io/atlas_dataset.md" },
      { "Parameters" = "api/io/parameters.md" }
    ]},
    { "Models" = [
      { "Equipement" = "api/models/equipment.md" },
      { "Market" = "api/models/market.md" }
    ]},
    { "Workflows" = [
      { "Workflow" = "api/workflow/workflow.md" },
      { "Workflow step" = "api/workflow/workflow_step.md" }
    ]},
    { "Optimisation" = [
      { "Solver Interface" = "api/solver/interface.md" },
      { "Other" = "api/solver/models.md" }
    ]},
    { "Others" = [
      { "Enum" = "api/enum.md" },
      { "Logging" = "api/logging.md" }
    ]}
  ]}
]

[project.theme]
name = "material"
variant = "modern"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "search.suggest",
  "content_code.copy",
  "content_tabs.link",
  "content_code.annotate",
  "navigation.tracking",
  "navigation.top",
  "navigation.footer",
  "toc.follow"
]

# Palette configuration
[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"

[project.extra]
generator = true

[project.extra.version]
provider = "mike"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/rte-france/ATLAS"
name = "Github"

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
use_pygments = true
linenums =  true
pygments_style = "monokai"
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.toc]
permalink = true

[project.plugins.mkdocstrings]
default_handler = "python"
[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading = false
heading_level = true
show_signature_annotations = true
docstring_style = "sphinx"
show_source = true
merge_init_into_class = true
signature_crossrefs = true
show_symbol_type_heading = true
show_symbol_type_toc = true
inherited_members = true
separate_signature = true
unwrap_annotated = true
