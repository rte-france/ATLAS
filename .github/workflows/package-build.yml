name: Package Build Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Check that the package builds
        run: uv build
