name: Package Build Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Check that the package builds
        run: uv build
