name: CI/CD Pipeline

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install uv
      run: |
        pip install uv
        
    - name: Install dependencies
      run: |
        uv sync
        
    - name: Upload virtual environment
      uses: actions/upload-artifact@v3
      with:
        name: venv
        path: |
          .venv/
          ~/.cache/uv/

  lint:
    needs: setup
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Download virtual environment
      uses: actions/download-artifact@v3
      with:
        name: .venv
        path: .
        
    - name: Lint with ruff
      run: |
        uv run ruff check atlas
        uv run ruff format --check atlas

  test:
    needs: setup
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Download virtual environment
      uses: actions/download-artifact@v3
      with:
        name: .venv
        path: .
        
    - name: Test with pytest
      run: |
        uv run pytest

  docs:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Download virtual environment
      uses: actions/download-artifact@v3
      with:
        name: .venv
        path: .
        
    - name: Build docs
      run: |
        uv run mkdocs build
        
    - name: Deploy docs
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: site
        clean: true