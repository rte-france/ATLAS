name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Test with pytest and coverage (without integration tests)
        if: github.event_name == 'push'
        run: uv run pytest -v --cov=atlas --cov-report=xml --disable-warnings -m "not integration and not perf"

      - name: Test with pytest and coverage (with integration tests)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: uv run pytest -v --cov=atlas --cov-report=xml --disable-warnings -m "not perf"

  perf:
    # Execution times checked against tests/dataset/performance_thresholds.json, without
    # coverage so that the measured times are not inflated by instrumentation.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Check execution times against thresholds
        env:
          PERF_TIMINGS_JSON: perf-timings.json
        run: uv run pytest -v --disable-warnings -m perf

      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-timings-${{ github.run_attempt }}
          path: perf-timings.json
          if-no-files-found: ignore
