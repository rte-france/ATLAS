name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Test with pytest and coverage
        run: uv run pytest -v --cov=atlas --cov-report=xml --disable-warnings -m "not tnr"

      - name: TNR with pytest and coverage
        run: uv run pytest -v -s --cov=atlas --cov-report=xml --disable-warnings -m "tnr"

      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
