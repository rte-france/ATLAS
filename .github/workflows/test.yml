name: Test

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Test with pytest and coverage
        run: uv run pytest -v --cov=atlas --cov-report=xml --disable-warnings -m "not tnr"

      - name: TNR with pytest and coverage
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: uv run pytest -v -s --cov=atlas --cov-report=xml --disable-warnings -m "tnr"
