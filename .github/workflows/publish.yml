name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}

    environment:
      name: pypi
      url: https://pypi.org/p/rte-atlas

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Verify tag format
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $GITHUB_REF does not match expected format <MAJOR>.<MINOR>.<PATCH>"
            exit 1
          fi

      - name: Verify tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $GITHUB_REF is not on main"
            exit 1
          }

      - name: Verify release tag matches pyproject.toml version
        run: |
          PYPROJECT_VERSION=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF#refs/tags/}"

          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: pyproject.toml=$PYPROJECT_VERSION, tag=$TAG_VERSION"
            exit 1
          fi

      - name: Verify changelog contains a section for this version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"

          if ! grep -qE "^## ${TAG_VERSION}$" docs/changelog.md; then
            echo "No '## ${TAG_VERSION}' section found in docs/changelog.md"
            exit 1
          fi

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1
