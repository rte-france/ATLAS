name: Type Check (mypy)

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  type-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run mypy
        run: uv run mypy atlas
