name: Build Documentation

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  doc-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group docs --no-dev

      - name: Build documentation website
        run: uv run zensical build --config-file zensical.toml
