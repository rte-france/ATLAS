name: Docs Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --group docs --no-dev

      - name: Build docs
        run: uv run mkdocs build
